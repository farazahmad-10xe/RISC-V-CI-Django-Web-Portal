{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · RISC-V CI Portal</title><link rel="stylesheet" href="{% static 'results/portal.css' %}"></head>
<body class="login-page"><main class="login-card"><span class="brand-mark large-mark">RV</span><p class="eyebrow">Apollo validation services</p><h1>RISC-V CI Portal</h1><p class="muted">Sign in to view board executions and reports.</p>{% if form.errors %}<div class="alert">Incorrect username or password.</div>{% endif %}<form method="post">{% csrf_token %}<label>Username{{ form.username }}</label><label>Password{{ form.password }}</label><button class="button full" type="submit">Sign in</button></form></main></body></html>
